# drover configuration: copy to ~/.config/drover/config.ini (or point $DROVER_CONFIG at it).
# Lists are comma- or newline-separated. Every key below shows its default unless marked "example".

[drover]
# Directories whose subdirectories are places: each one with a .git, AGENTS.md, CLAUDE.md or README.
roots = ~/code, ~/src, ~/projects
# Extra single directories that are places themselves (example: a notes or documents tree).
places =
# Glob patterns of directory names under roots to skip (example: *.old, *-backup).
ignore =
# The place used when nothing else decides. Empty: drover stops and asks you to name one.
default =
# The agent command. Your interactive shell runs it (this one after the cd, or with -t the new
# pane's), so an alias works (example: c, for claude --dangerously-skip-permissions).
command = claude
# The full line run: {command} as above, {file} the task file, already shell-quoted.
launch = {command} "$(cat {file})"
# Where Claude Code keeps its session transcripts, read for the history signal and drover eval.
history = ~/.claude/projects
# The ten most similar past tasks count as a signal when the best one scores at least
# history_min_score (BM25) and their place holds at least history_min_share of the votes.
history_min_score = 12
history_min_share = 0.6
# A short task's shape, "fix _ to _" for "fix colour to color", counts as a signal when at least
# form_min_tasks past tasks had it and at least form_min_share of them ran in one place.
form_min_tasks = 3
form_min_share = 0.75

[model]
# OpenAI-compatible base URLs, tried in order until one answers. Empty: rules only.
# Example: http://127.0.0.1:8080/v1, http://gpu-box:4000/v1
endpoints =
model =
api_key =
timeout = 60
# JSON merged into the request body. Example for a Qwen3 model on llama.cpp or vLLM, so it answers
# without thinking first: {"chat_template_kwargs": {"enable_thinking": false}}
extra = {}

[keywords]
# <place> = words or /regexes/ that point to it, matched case-insensitively. Examples:
# frigate = camera, nvr, /\bcam\d+\b/
# infra = router, mikrotik, zabbix

[describe]
# <place> = a description to use instead of the first paragraph of its AGENTS.md or README. Example:
# web = Browser automation: every website task, shops, bookings, accounts.

[moved]
# <old path> = <new path>, for directories that moved, so history from before the move still counts.
# Example: ~/infra = ~/code/infra
